<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Code With Sandesh</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="bg-animation"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon">&lt;/&gt;</div>
                Code<span class="highlight">WithSandesh</span>
            </a>
            <div class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="courses.html">Courses</a>
                <a href="admin.html" class="active">Admin</a>
            </div>
            <div class="nav-actions" id="nav-actions"></div>
            <div class="nav-toggle" onclick="document.getElementById('nav-links').classList.toggle('mobile-open')">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <!-- Admin Layout -->
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <h4
                style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:var(--space-lg)">
                Admin Panel</h4>
            <nav class="admin-sidebar-nav">
                <a href="#" class="active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="#" data-tab="courses"><i class="fas fa-book"></i> Courses</a>
                <a href="#" data-tab="payments"><i class="fas fa-credit-card"></i> Payments</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Dashboard Tab -->
            <div class="tab-content active" id="tab-dashboard">
                <div class="admin-header">
                    <h2><i class="fas fa-chart-pie" style="color:var(--accent-secondary)"></i> Dashboard</h2>
                </div>
                <div class="stats-grid" id="stats-grid"></div>
            </div>

            <!-- Courses Tab -->
            <div class="tab-content" id="tab-courses">
                <div class="admin-header">
                    <h2><i class="fas fa-book" style="color:var(--accent-secondary)"></i> Manage Courses</h2>
                    <button class="btn btn-primary" id="btn-add-course"><i class="fas fa-plus"></i> Add Course</button>
                </div>
                <div style="overflow-x:auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>YouTube Link</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="courses-tbody">
                            <tr>
                                <td colspan="6" style="text-align:center;padding:2rem">
                                    <div class="spinner" style="margin:0 auto"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Payments Tab -->
            <div class="tab-content" id="tab-payments">
                <div class="admin-header">
                    <h2><i class="fas fa-credit-card" style="color:var(--accent-secondary)"></i> Payment Requests</h2>
                </div>
                <div style="overflow-x:auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>User Email</th>
                                <th>Course</th>
                                <th>Screenshot</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="payments-tbody">
                            <tr>
                                <td colspan="5" style="text-align:center;padding:2rem">
                                    <div class="spinner" style="margin:0 auto"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Course Modal -->
    <div class="modal-overlay" id="course-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add New Course</h3>
                <button class="modal-close" onclick="closeModal('course-modal')">×</button>
            </div>
            <form id="course-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="course-title-input">Course Title *</label>
                        <input type="text" id="course-title-input" class="form-input"
                            placeholder="e.g. CSS Grid Masterclass" required>
                    </div>
                    <div class="form-group">
                        <label for="course-desc">Description</label>
                        <textarea id="course-desc" class="form-textarea"
                            placeholder="Describe the course..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="course-category">Category *</label>
                        <input type="text" id="course-category" class="form-input"
                            placeholder="e.g. CSS, JavaScript, React" required>
                    </div>
                    <div class="form-group">
                        <label for="course-youtube">YouTube URL *</label>
                        <input type="url" id="course-youtube" class="form-input"
                            placeholder="https://youtube.com/watch?v=..." required>
                    </div>
                    <div class="form-group">
                        <label for="course-type">Course Type *</label>
                        <select id="course-type" class="form-select" required>
                            <option value="free">Free</option>
                            <option value="paid">Paid</option>
                        </select>
                    </div>
                    <div class="form-group hidden" id="price-group">
                        <label for="course-price-input">Price (Rs.)</label>
                        <input type="text" id="course-price-input" class="form-input" placeholder="e.g. 199">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('course-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Screenshot Modal -->
    <div class="modal-overlay" id="screenshot-modal">
        <div class="modal" style="max-width:700px">
            <div class="modal-header">
                <h3>Payment Screenshot</h3>
                <button class="modal-close" onclick="closeModal('screenshot-modal')">×</button>
            </div>
            <div class="modal-body" style="text-align:center">
                <img id="screenshot-full" src="" alt="Payment Screenshot"
                    style="max-width:100%;border-radius:var(--radius-md)">
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
